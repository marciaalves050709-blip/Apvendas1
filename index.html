  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <meta name="description" content="Sistema completo de PDV, catálogo e controle de estoque para appvendas." />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta property="og:title" content="appvendas" />
    <meta property="og:description" content="Sistema completo de PDV, catálogo e controle de estoque para appvendas." />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="appvendas" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Automatic version check and auto-migration for installed apps and returning users
      (function() {
        var APP_BUILD_VER = '62';
        try {
          var storedVer = localStorage.getItem('appvendas_client_build_ver');
          if (storedVer && storedVer !== APP_BUILD_VER) {
            console.log('[PWA] Stored version ' + storedVer + ' is older than ' + APP_BUILD_VER + '. Triggering auto-upgrade...');
            // Purge caches immediately
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
          }
          localStorage.setItem('appvendas_client_build_ver', APP_BUILD_VER);
        } catch(e) {}
      })();

      window.__PWA_INSTALL_PROMPT__ = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__PWA_INSTALL_PROMPT__ = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
        console.log('[PWA] beforeinstallprompt pronto para instalação direta');
      });
      window.addEventListener('appinstalled', function() {
        window.__PWA_INSTALL_PROMPT__ = null;
        try {
          localStorage.setItem('appvendas_pwa_installed', 'true');
        } catch(err) {}
        window.dispatchEvent(new CustomEvent('pwa-installed'));
        console.log('[PWA] Aplicativo instalado com sucesso');
      });

      // Global cache-busting helper for existing installed apps
      window.__clearAppCacheAndReload = function() {
        if (window.__is_reloading_app) return;
        window.__is_reloading_app = true;

        try {
          // Render immediate full-screen update overlay for instant visual feedback
          var overlay = document.createElement('div');
          overlay.id = 'app-updating-fullscreen-overlay';
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,0.95);backdrop-filter:blur(8px);z-index:9999999;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center;padding:24px;box-sizing:border-box;';
          overlay.innerHTML = 
            '<div style="width:68px;height:68px;border-radius:22px;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 12px 30px rgba(16,185,129,0.4);margin-bottom:16px;">⚡</div>' +
            '<h2 style="font-size:20px;font-weight:900;margin:0 0 8px 0;letter-spacing:-0.5px;color:#ffffff;">Atualizando Aplicativo Instalado...</h2>' +
            '<p style="font-size:13px;color:#94a3b8;margin:0 0 20px 0;max-width:340px;line-height:1.5;">Limpando memória temporária do celular e ativando a Versão 62 com links da empresa e produtos em tempo real.</p>' +
            '<div style="width:38px;height:38px;border:3px solid #334155;border-top-color:#10b981;border-radius:50%;animation:appSpin 0.7s linear infinite;"></div>' +
            '<style>@keyframes appSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>';
          document.body.appendChild(overlay);
        } catch(e) {}

        var performReload = function() {
          try { 
            localStorage.setItem('appvendas_client_build_ver', '62');
          } catch(e) {}
          try {
            var curUrl = new URL(window.location.href);
            curUrl.searchParams.set('app_ver', '62');
            curUrl.searchParams.set('atualizado', Date.now().toString());
            window.location.replace(curUrl.toString());
          } catch(e) {
            window.location.reload();
          }
        };

        var tasks = [];
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).catch(function() {})
          );
        }
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              return Promise.all(regs.map(function(r) { 
                try { r.active && r.active.postMessage({ type: 'SKIP_WAITING' }); } catch(e){}
                try { r.active && r.active.postMessage({ type: 'PURGE_ALL_CACHES' }); } catch(e){}
                return r.unregister(); 
              }));
            }).catch(function() {})
          );
        }

        var safetyTimer = setTimeout(performReload, 600);
        Promise.all(tasks).then(function() {
          clearTimeout(safetyTimer);
          setTimeout(performReload, 200);
        }).catch(function() {
          clearTimeout(safetyTimer);
          performReload();
        });
      };

      // Failsafe error catcher for early script errors
      window.addEventListener('error', function(e) {
        var loaderEl = document.getElementById('app-initial-loader');
        if (loaderEl) {
          loaderEl.innerHTML = 
            '<div style="max-width:360px;background:#1e293b;border:1px solid #e11d48;border-radius:20px;padding:24px;text-align:center;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
              '<div style="font-size:32px;margin-bottom:8px;">⚠️</div>' +
              '<h3 style="color:#ffffff;font-size:16px;font-weight:bold;margin:0 0 8px 0;">Atualização Disponível</h3>' +
              '<p style="color:#cbd5e1;font-size:12px;margin:0 0 16px 0;line-height:1.5;">O aplicativo detectou uma nova versão. Clique no botão abaixo para carregar imediatamente:</p>' +
              '<button onclick="window.__clearAppCacheAndReload()" style="width:100%;padding:12px;background:#4f46e5;color:#ffffff;font-weight:bold;font-size:13px;border:none;border-radius:12px;cursor:pointer;">🔄 Atualizar Aplicativo Agora</button>' +
            '</div>';
        }
      });
    </script>
  </head>
  <body class="h-full bg-slate-900 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root" class="h-full">
      <!-- Instant In-Memory Shell: Prevents white screen and guarantees immediate visual feedback -->
      <div id="app-initial-loader" style="height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px;box-sizing:border-box;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:14px;max-width:320px;text-align:center;">
          <div style="width:58px;height:58px;background:linear-gradient(135deg,#4f46e5,#3b82f6);border-radius:18px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 20px rgba(79,70,229,0.35);font-size:28px;">
            ⚡
          </div>
          <div>
            <div style="font-size:18px;font-weight:800;letter-spacing:-0.5px;color:#ffffff;">appvendas</div>
            <div style="font-size:12px;color:#94a3b8;margin-top:2px;">Iniciando sistema...</div>
          </div>
          <div style="width:36px;height:36px;border:3px solid #334155;border-top-color:#6366f1;border-radius:50%;animation:appSpin 0.8s linear infinite;margin-top:4px;"></div>
          
          <!-- Auto-reveal emergency refresh if device network takes more than 2.5s -->
          <div id="app-loader-delayed" style="display:none;margin-top:12px;width:100%;">
            <p style="font-size:11px;color:#94a3b8;margin:0 0 10px 0;">Demorando para abrir?</p>
            <button onclick="window.__clearAppCacheAndReload()" style="width:100%;padding:10px 16px;background:#1e293b;border:1px solid #4f46e5;color:#818cf8;border-radius:12px;font-size:12px;font-weight:bold;cursor:pointer;">
              🔄 Atualizar e Limpar Cache
            </button>
          </div>
        </div>
      </div>
      <style>
        @keyframes appSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      </style>
      <script>
        setTimeout(function() {
          var delayed = document.getElementById('app-loader-delayed');
          if (delayed) delayed.style.display = 'block';
        }, 2500);
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
